# 每天把 Evolution-X 上游同步到自己的镜像仓库（纯镜像，强制对齐）
# 需要 secret：SYNC_TOKEN（GitHub PAT，classic，勾 repo）
#
# 命名约定：上游 Evolution-X/<name>  →  自己的 mcajun87/Evolution-X_<name>
# 所以清单 evo-repos.txt 里只写上游仓库名，目标仓库名由这里拼出来，
# 避免"清单里写死目标名"和"改名后忘记同步"两件事脱节。
#
# 这些镜像仓库是纯镜像，不要在上面放自己的改动；
# 自己的改动放在 device/samsung/*、kernel/* 这些 fork 上。
name: sync evolution-x forks

on:
  schedule:
    - cron: '43 5,17 * * *'    # 每天 05:43 / 17:43 UTC = 北京 13:43 / 01:43
  workflow_dispatch:
    inputs:
      only:
        description: '只同步某个上游仓库名（留空=全部）'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          set -eu
          python3 - "${{ inputs.only }}" <<'PY' > matrix.json
          import json, sys
          only = sys.argv[1].strip()
          rows = []
          for line in open('evo-repos.txt', encoding='utf-8'):
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              name = line.split('|')[0].strip()
              if not name:
                  continue
              if only and name != only:
                  continue
              rows.append({"name": name, "fork": "Evolution-X_" + name})
          json.dump({"include": rows}, sys.stdout)
          PY
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          python3 -c "import json;print('将同步', len(json.load(open('matrix.json'))['include']), '个仓库')"

  sync:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - name: Mirror Evolution-X/${{ matrix.name }} -> ${{ matrix.fork }}
        env:
          TOK: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -eu
          [ -n "${TOK:-}" ] || { echo "::error::缺少 secret SYNC_TOKEN"; exit 1; }
          git clone --bare --filter=blob:none \
            "https://github.com/Evolution-X/${{ matrix.name }}.git" w.git
          cd w.git
          git remote set-url origin \
            "https://x-access-token:${TOK}@github.com/mcajun87/${{ matrix.fork }}.git"
          # 全分支强制镜像：上游有什么就是什么
          git push --force --prune origin 'refs/heads/*:refs/heads/*'
          git push --force origin 'refs/tags/*:refs/tags/*' || true
          echo "OK ${{ matrix.name }} -> ${{ matrix.fork }}"
